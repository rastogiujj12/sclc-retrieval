[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sclc-retrieval"
version = "0.7.10"
description = "Controlled retrieval experiment for section-constrained late chunking"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Ujjwal Rastogi"}]
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.27",
    "transformers>=5.14,<6",
    "peft>=0.14",
    "torch>=2.3",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
sclc = "sclc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sclc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sclc"]
